services:
  db:
    image: postgres:17-alpine
    env_file: .env
    environment:
      POSTGRES_USER: festpass
      POSTGRES_DB: festpass
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: nitintripathi01/fest-backend:1.0.0
    env_file: .env
    environment:
      DB_HOST: db
      DB_USER: festpass
      DB_NAME: festpass
      REGNO: "202401100100169"
      APP_VERSION: "1.0.0"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-backend
      - backend-db

  frontend:
    image: nginx:1.30-alpine
    ports:
      - "8069:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - frontend-backend

networks:
  frontend-backend:
  backend-db:

volumes:
  db-data: